<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가입하기 - 사이소</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #157347;
        }

        .register-link {
            text-align: center;
            margin-top: 15px;
            display: block;
            color: #666;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .flash-messages {
            color: #dc3545;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body style="background-color: #f8f9fa;">
    <div class="login-container">
        <h1>Saiso 개인 공간 생성</h1>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">사용할 아이디</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">사용할 비밀번호</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="admin_password">최고 관리자 승인 코드</label>
                <input type="password" id="admin_password" name="admin_password" required
                    placeholder="ADMIN_PASSWORD 환경변수 값">
            </div>
            <button type="submit" class="login-btn">생성하기</button>
        </form>
        <a href="{{ url_for('login') }}" class="register-link">이미 공간이 있나요? (로그인)</a>
    </div>
</body>

</html>
